[project]
name = "slurm-monitor"
version = "0.3.0"
description = "A terminal UI for monitoring Slurm jobs in real-time over SSH"
readme = "README.md"
authors = [
    { name = "Matteo Spanio", email = "spanio@dei.unipd.it" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "paramiko>=3.5",
    "rich>=14.3.1",
    "textual>=7.4.0",
]

[project.scripts]
slurm-monitor = "slurm_monitor.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
