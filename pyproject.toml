[project]
name = "slurmhub"
version = "1.2.0"
description = "A terminal UI for monitoring Slurm jobs in real-time over SSH"
readme = "README.md"
authors = [
    { name = "Matteo Spanio", email = "spanio@dei.unipd.it" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "click>=8.1",
    "paramiko>=3.5",
    "pyside6>=6.11.1",
    "qtawesome>=1.4.2",
    "rich>=14.3.1",
    "sqlalchemy>=2.0",
    "textual>=7.4.0",
]

[project.scripts]
slurmhub = "slurmhub.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-qt>=4.5.0",
    "pytest-xdist>=3.8.0",
]
docs = [
    "sphinx>=8.1",
    "myst-parser>=4.0",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5",
    "sphinx-design>=0.6",
]
# Used by the release workflow to build standalone GUI binaries (CI only).
build = [
    "pyinstaller>=6.6",
]
