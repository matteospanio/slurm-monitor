[project]
name = "slurm-monitor"
version = "0.2.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "matteospanio", email = "spanio@dei.unipd.it" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "paramiko>=3.5",
    "rich>=14.3.1",
    "textual>=7.4.0",
]

[project.scripts]
slurm-monitor = "slurm_monitor.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
