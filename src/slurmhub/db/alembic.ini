# Alembic config for local development only (autogenerating new revisions).
# The application runs migrations programmatically via
# slurmhub.db.engine._run_migrations and does NOT read this file at runtime.
#
# To create a new migration after editing slurmhub/db/models.py:
#   cd src/slurmhub/db
#   uv run alembic -c alembic.ini revision --autogenerate -m "describe change"
#   uv run alembic -c alembic.ini upgrade head   # against the dev URL below

[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///%(here)s/dev-history.db
prepend_sys_path = ../../..

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
